<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>正在打开 · 武汉诉求线索看板</title>
<style>
  :root{--ink:#0f172a;--muted:#64748b;--brand:#0b3d5c}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#0b3d5c,#155e85);color:#fff;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;padding:24px}
  .box{max-width:420px;width:100%;text-align:center}
  h1{font-size:22px;margin:0 0 8px}
  p{color:rgba(255,255,255,.85);font-size:14px;line-height:1.7;margin:0 0 18px}
  .spin{width:34px;height:34px;border:3px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;margin:0 auto 18px;animation:r 1s linear infinite}
  @keyframes r{to{transform:rotate(360deg)}}
  .btns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
  a{display:inline-block;padding:10px 18px;border-radius:999px;font-size:14px;text-decoration:none;background:rgba(255,255,255,.16);color:#fff;border:1px solid rgba(255,255,255,.4)}
  a.primary{background:#fff;color:var(--brand);border-color:#fff;font-weight:600}
  .hint{font-size:12px;color:rgba(255,255,255,.65);margin-top:16px}
</style>
</head>
<body>
<div class="box">
  <div class="spin" id="spin"></div>
  <h1>武汉诉求线索看板</h1>
  <p id="status">正在检测线路…</p>
  <div class="btns">
    <a class="primary" id="gh" href="https://anywise666.github.io/wuhan-civic-leads/">GitHub 版</a>
    <a id="jd" href="https://cdn.jsdelivr.net/gh/Anywise666/wuhan-civic-leads@main/index.html">备用版</a>
  </div>
  <p class="hint">通常 2 秒内自动打开；若没反应，点上面按钮</p>
</div>
<script>
(function(){
  var GH = "https://anywise666.github.io/wuhan-civic-leads/";
  var JD = "https://cdn.jsdelivr.net/gh/Anywise666/wuhan-civic-leads@main/index.html";
  var statusEl = document.getElementById("status");
  var spin = document.getElementById("spin");
  var done = false;

  function go(url, msg){
    if (done) return;
    done = true;
    statusEl.textContent = msg;
    // 给状态文案一帧渲染时间再跳转
    setTimeout(function(){ location.replace(url); }, 150);
  }

  var timer = setTimeout(function(){
    go(JD, "GitHub 线路较慢，正在打开备用版…");
  }, 2800);

  var img = new Image();
  img.onload = function(){
    clearTimeout(timer);
    go(GH, "GitHub 线路可用，正在打开…");
  };
  img.onerror = function(){
    clearTimeout(timer);
    go(JD, "GitHub 暂时打不开，正在打开备用版…");
  };
  img.src = GH + "icon-192.png?ping=" + Date.now();
})();
</script>
</body>
</html>
